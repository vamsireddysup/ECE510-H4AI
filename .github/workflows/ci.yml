name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y verilator g++ make

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test tools
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Check documentation
        run: make check-docs

      - name: Lint RTL
        run: make lint

      - name: Test reference model
        run: make test-model

      - name: Run 4x4 integration test
        run: make test-integration
